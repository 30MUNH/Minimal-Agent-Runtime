<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect width="800" height="35" rx="10" fill="#161b22"/>
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#27c93f"/>
  <text x="400" y="22" fill="#8b949e" font-family="monospace" font-size="12" text-anchor="middle">Terminal — python3 examples/offline_todo_report_demo.py</text>
  <text x="25" y="70" fill="#79c0ff" font-family="monospace" font-size="14">$ python3 examples/offline_todo_report_demo.py</text>
  <text x="25" y="110" fill="#e6edf3" font-family="monospace" font-size="14">Created workspace/todo-report.md and remembered its location.</text>
  <text x="25" y="145" fill="#3fb950" font-family="monospace" font-size="14">report_exists = True</text>
  <text x="25" y="180" fill="#a5d6ff" font-family="monospace" font-size="14">report_path = workspace/todo-report.md</text>
  <text x="25" y="215" fill="#d2a8ff" font-family="monospace" font-size="14">memory.todo_report_path = workspace/todo-report.md</text>
  <text x="25" y="260" fill="#e6edf3" font-family="monospace" font-size="14">The TODO report was saved at workspace/todo-report.md.</text>
  <text x="25" y="320" fill="#8b949e" font-family="monospace" font-size="14">----------------------------------------------------------------------</text>
  <text x="25" y="355" fill="#58a6ff" font-family="monospace" font-size="16">✓ Deterministic Workspace &amp; Persistent Memory Verified</text>
</svg>
