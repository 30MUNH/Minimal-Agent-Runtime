[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimal-agent-runtime"
version = "0.1.0"
description = "A minimal but real agent runtime with tool-calling and memory."
requires-python = ">=3.11"

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
